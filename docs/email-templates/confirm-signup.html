<!-- Supabase → Authentication → Emails → Confirm signup -->
<!-- חובה: {{ .Token }} — הקוד שהמשתמש מזין ב-verifyOtp({ type: "signup" }) -->
<div dir="rtl" style="font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;padding:32px 16px;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;text-align:right;">
    <h1 style="margin:0 0 8px;font-size:22px;color:#111827;">ברוך הבא ל-Naimly</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#4b5563;">
      כדי להשלים את ההרשמה, הזן את קוד האימות הבא במסך ההרשמה:
    </p>

    <div style="text-align:center;margin:0 0 24px;">
      <div style="display:inline-block;font-size:32px;letter-spacing:8px;font-weight:bold;color:#4b3bad;background:#f1efff;border-radius:10px;padding:16px 24px;">
        {{ .Token }}
      </div>
    </div>

    <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#6b7280;">
      הקוד תקף לזמן מוגבל. לחלופין ניתן לאשר בלחיצה על הכפתור:
    </p>

    <div style="text-align:center;margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6d4aff;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;border-radius:8px;padding:12px 28px;">
        אישור כתובת המייל
      </a>
    </div>

    <p style="margin:0;font-size:13px;line-height:1.7;color:#6b7280;">
      אם לא ביקשת להירשם, אין צורך לעשות דבר. אפשר להתעלם מהמייל הזה.
    </p>
  </div>
</div>
